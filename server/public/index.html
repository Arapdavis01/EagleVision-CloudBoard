<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EagleVision CloudBoard</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --primary: #6366f1;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem; width: 100%; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    h2 { font-size: 1.3rem; margin-bottom: 1rem; }
    input, select, textarea {
      width: 100%;
      padding: 0.7rem 0.9rem;
      margin-top: 0.3rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.secondary:hover { background: var(--border); }
    .logout { float: right; }
    .hidden { display: none; }
    .error { color: var(--danger); margin-top: 0.5rem; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.8rem 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    th { color: var(--muted); font-weight: 500; }
    .form-row { display: flex; gap: 1rem; }
    .form-row > * { flex: 1; }
    details { margin: 1rem 0; }
    summary { cursor: pointer; color: var(--muted); font-weight: 500; margin-bottom: 0.5rem; }
    @media (max-width: 640px) {
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Screen -->
    <div id="login-screen" class="card" style="max-width:420px; margin: 4rem auto;">
      <h1>🦅 EagleVision</h1>
      <p style="color: var(--muted); margin-bottom: 2rem;">CloudBoard</p>
      <div style="margin-bottom: 1rem;">
        <input type="email" id="email" placeholder="Email" value="dancun6742@gmail.com">
      </div>
      <div style="margin-bottom: 1rem;">
        <input type="password" id="password" placeholder="Password">
      </div>
      <button onclick="login()" style="width:100%">Login</button>
      <div id="login-error" class="error"></div>
    </div>

    <!-- Dashboard (hidden until login) -->
    <div id="dashboard" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>🦅 EagleVision CloudBoard</h1>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>

      <!-- Add Project Form -->
      <div class="card">
        <h2>➕ Add Project</h2>
        <div class="form-row">
          <input id="name" placeholder="Project Name *">
          <input id="ownerName" placeholder="Owner Name">
        </div>
        <div class="form-row">
          <input id="ownerContact" placeholder="Owner Contact">
          <input id="location" placeholder="Location">
        </div>
        <div class="form-row">
          <select id="status">
            <option value="active">Active</option>
            <option value="maintenance">Maintenance</option>
            <option value="completed">Completed</option>
            <option value="on-hold">On Hold</option>
          </select>
          <input id="hostingProvider" placeholder="Hosting Provider (e.g. Render)">
        </div>
        <div class="form-row">
          <input id="deploymentMethod" placeholder="Deployment (e.g. GitHub)">
          <input id="dbProvider" placeholder="DB Provider (e.g. Supabase)">
        </div>
        <details>
          <summary>🔐 Database Credentials</summary>
          <div class="form-row">
            <input id="dbHost" placeholder="Host">
            <input id="dbPort" type="number" placeholder="Port">
          </div>
          <div class="form-row">
            <input id="dbName" placeholder="Database Name">
            <input id="dbUser" placeholder="User">
          </div>
          <input id="dbPassword" type="password" placeholder="Password">
          <input id="dbConnectionString" placeholder="Connection String">
        </details>
        <div class="form-row">
          <input id="gitRepoUrl" placeholder="Git Repo URL">
          <input id="liveUrl" placeholder="Live URL">
        </div>
        <div class="form-row">
          <input id="techStack" placeholder="Tech Stack">
          <input id="version" placeholder="Version">
        </div>
        <textarea id="notes" rows="2" placeholder="Notes"></textarea>
        <button onclick="addProject()" style="margin-top:1rem;">Add Project</button>
      </div>

      <!-- Project List -->
      <div class="card">
        <h2>📁 Projects</h2>
        <div id="project-list">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const tokenKey = 'eaglevision_token';
    let token = localStorage.getItem(tokenKey);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        token = data.token;
        localStorage.setItem(tokenKey, token);
        showDashboard();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    function logout() {
      localStorage.removeItem(tokenKey);
      token = null;
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      fetch('/api/auth/logout', { method: 'POST' }); // optional
    }

    function showDashboard() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      loadProjects();
    }

    async function apiFetch(url, options = {}) {
      options.headers = { ...options.headers, 'Authorization': `Bearer ${token}` };
      const res = await fetch(url, options);
      if (res.status === 401) { logout(); throw new Error('Session expired'); }
      return res;
    }

    async function loadProjects() {
      const listEl = document.getElementById('project-list');
      try {
        const res = await apiFetch('/api/projects');
        const projects = await res.json();
        if (projects.length === 0) {
          listEl.innerHTML = '<p style="color: var(--muted);">No projects yet. Add your first one above.</p>';
          return;
        }
        let html = '<table><tr><th>Name</th><th>Owner</th><th>Location</th><th>Status</th><th>Hosting</th><th>DB</th></tr>';
        projects.forEach(p => {
          html += `<tr>
            <td>${escapeHtml(p.name) || ''}</td>
            <td>${escapeHtml(p.ownerName) || ''}</td>
            <td>${escapeHtml(p.location) || ''}</td>
            <td>${escapeHtml(p.status) || ''}</td>
            <td>${escapeHtml(p.hostingProvider) || ''}</td>
            <td>${escapeHtml(p.dbProvider) || ''}</td>
          </tr>`;
        });
        html += '</table>';
        listEl.innerHTML = html;
      } catch (err) {
        listEl.innerHTML = `<p class="error">Failed to load projects.</p>`;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function addProject() {
      const get = (id) => document.getElementById(id).value.trim();
      const project = {
        name: get('name'),
        ownerName: get('ownerName'),
        ownerContact: get('ownerContact'),
        location: get('location'),
        status: get('status'),
        hostingProvider: get('hostingProvider'),
        deploymentMethod: get('deploymentMethod'),
        dbProvider: get('dbProvider'),
        dbHost: get('dbHost'),
        dbPort: get('dbPort') ? parseInt(get('dbPort')) : null,
        dbName: get('dbName'),
        dbUser: get('dbUser'),
        dbPassword: get('dbPassword'),
        dbConnectionString: get('dbConnectionString'),
        gitRepoUrl: get('gitRepoUrl'),
        liveUrl: get('liveUrl'),
        techStack: get('techStack'),
        version: get('version'),
        notes: get('notes')
      };
      if (!project.name) return alert('Project name is required');

      try {
        const res = await apiFetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(project)
        });
        if (!res.ok) throw new Error('Failed to add project');
        // Clear form
        document.querySelectorAll('#dashboard input, #dashboard textarea').forEach(el => {
          if (el.type !== 'password') el.value = '';
        });
        document.getElementById('status').value = 'active';
        loadProjects();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    // Check token on load
    if (token) showDashboard();
  </script>
</body>
</html>
